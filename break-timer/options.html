<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Break Timer settings</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      main { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
      h1 { margin-top: 0; }
      .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--track); }
      .field small { display: block; color: var(--muted); }
      input[type="number"] { width: 80px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: inherit; font: inherit; }
      input[type="checkbox"] { width: 18px; height: 18px; }
      .ratio { margin: 16px 0; }
      .ratio-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; }
      .ratio-bar .work { background: var(--work); }
      .ratio-bar .break { background: var(--break); }
      .ratio p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
      footer { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
      #status.ok { color: var(--ok); }
      #status.error { color: var(--error); }
      .note { color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Break Timer</h1>

      <label class="field">
        <span>Work period <small>1–240 minutes</small></span>
        <input type="number" id="workMinutes" min="1" max="240" />
      </label>
      <label class="field">
        <span>Break <small>1–120 minutes</small></span>
        <input type="number" id="breakMinutes" min="1" max="120" />
      </label>

      <div class="ratio">
        <div class="ratio-bar"><div class="work" id="ratio-work"></div><div class="break" id="ratio-break"></div></div>
        <p id="ratio-text"></p>
      </div>

      <label class="field">
        <span>Start the next work period automatically after a break
          <small>When off, the timer stops after the break until you click Start.</small></span>
        <input type="checkbox" id="autoStartWork" />
      </label>
      <label class="field">
        <span>Open a reminder window when a break starts
          <small>In addition to the system notification (which may be muted by the OS).</small></span>
        <input type="checkbox" id="openBreakWindow" />
      </label>

      <footer>
        <button type="button" id="save" class="primary">Save</button>
        <button type="button" id="reset">Reset to defaults (45 / 15)</button>
        <span id="status" role="status"></span>
      </footer>
      <p class="note"><small>New durations apply from the next work period or break.</small></p>
    </main>
    <script src="common.js"></script>
    <script src="options.js"></script>
  </body>
</html>
